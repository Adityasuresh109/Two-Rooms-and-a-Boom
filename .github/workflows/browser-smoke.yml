name: Chromium browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'tests/browser-smoke.py'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Test real frontend in Chromium with mocked transport
        run: python tests/browser-smoke.py
