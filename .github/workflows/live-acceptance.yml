name: Live multiplayer acceptance
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Test and deploy game']
    types: [completed]
    branches: [main]
jobs:
  acceptance:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real Worker games and 25 WebSockets
        run: node tests/live-acceptance.mjs
